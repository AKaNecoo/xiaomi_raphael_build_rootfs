[Unit]
# Do NOT wait for systemd-udev-settle or slow deps - SLPI drops
# /dev/fastrpc-sdsp forever if hexagonrpcd does not open it within ~40s.
ConditionPathExists=
Wants=raphael-sensors-persist-perms.service raphael-sensors.service raphael-als-oem.service

[Service]
# Quotes required: unquoted value is split on spaces by systemd.
Environment="HEXAGONRPC_ARGS=-f /dev/fastrpc-sdsp -d sdsp -s -R /usr/share/qcom"
ExecStartPre=+/usr/libexec/raphael-hexagonrpcd-pre.sh
ExecStart=
ExecStart=/usr/bin/hexagonrpcd -f /dev/fastrpc-sdsp -d sdsp -s -R /usr/share/qcom
# als-oem moved out of the start job: its ssccli can wedge (bounded 10s by the
# kernel fix) but must not hold hexagonrpcd's job -> sensor chain -> multi-user.
ExecStartPost=+/bin/sh -c 'systemctl start --no-block raphael-als-oem.service || true'
# Fallback pull for the sensor stack even if als-oem fails early.
ExecStartPost=+/bin/sh -c 'systemctl start --no-block raphael-sensors.target || true'
# Bring up SensorProxy before GNOME so Mutter sets PanelOrientationManaged
ExecStartPost=+/bin/sh -c 'systemctl start --no-block iio-sensor-proxy.service || true'
Restart=on-failure
RestartSec=1
TimeoutStartSec=20
StartLimitIntervalSec=120
StartLimitBurst=6
